<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Mindbook mark: a mind (two hemispheres) that reads as an open book.
       Center fissure = the book spine. A lotus rests inside = calm, mindfulness.
       Tide -> storm outline; periwinkle + moon lotus. -->
  <defs>
    <linearGradient id="mk" x1="32" y1="8" x2="32" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4E92A6"/>
      <stop offset="1" stop-color="#4A4E75"/>
    </linearGradient>
  </defs>
  <g stroke="url(#mk)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- left hemisphere / left page -->
    <path d="M32 13c-2.6-3-7-3.4-9.4-1C19.4 9 13.6 9.8 12 14c-3.8.6-5.4 5.4-2.8 8.4-2.8 2.4-2 7.4 1.6 8.8-2.2 3-.4 7.6 3.4 8.2-1 3.6 2 7 5.8 6.4 1.6 2.2 4.8 2.8 7 1.2"/>
    <!-- right hemisphere / right page -->
    <path d="M32 13c2.6-3 7-3.4 9.4-1C44.6 9 50.4 9.8 52 14c3.8.6 5.4 5.4 2.8 8.4 2.8 2.4 2 7.4-1.6 8.8 2.2 3 .4 7.6-3.4 8.2 1 3.6-2 7-5.8 6.4-1.6 2.2-4.8 2.8-7 1.2"/>
    <!-- spine / brain fissure -->
    <path d="M32 13v34" stroke-width="1.8" opacity="0.55"/>
  </g>
  <!-- lotus resting inside the mind -->
  <g>
    <!-- outer base petals -->
    <path d="M32 39c-5.4 1-11-.6-13.6-4.4 3.2-2.6 8.4-2.4 11.4.4.9.9 1.6 2.2 2.2 4Z" fill="#5E72A8"/>
    <path d="M32 39c5.4 1 11-.6 13.6-4.4-3.2-2.6-8.4-2.4-11.4.4-.9.9-1.6 2.2-2.2 4Z" fill="#5E72A8"/>
    <!-- mid petals -->
    <path d="M32 39c-4.2-1.6-7-4.8-7-8.8 0-1.4.4-2.8 1-4.2 3.2 1.6 5.4 4.6 6 8.4Z" fill="#6B7FB3"/>
    <path d="M32 39c4.2-1.6 7-4.8 7-8.8 0-1.4-.4-2.8-1-4.2-3.2 1.6-5.4 4.6-6 8.4Z" fill="#6B7FB3"/>
    <!-- center petal -->
    <path d="M32 39c-3-2.4-4.8-5.6-4.8-9 0-3 1.6-6.2 4.8-8.8 3.2 2.6 4.8 5.8 4.8 8.8 0 3.4-1.8 6.6-4.8 9Z" fill="#8093C4"/>
    <circle cx="32" cy="26.5" r="1.9" fill="#C9A24B"/>
  </g>
</svg>
